<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AETHER // 60 FPS Hyper-Fractal Engine</title>
  <style>
    :root {
      --bg: #05070c;
      --panel-bg: rgba(10, 15, 25, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.35);
      --gold: #f59e0b;
      --emerald: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-border: rgba(255, 255, 255, 0.1);
      --btn-active: rgba(0, 240, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    #viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }

    /* Minimalist Auto-Hiding Top HUD Bar */
    #top-bar {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 30;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #top-bar.hidden {
      opacity: 0;
      transform: translate(-50%, -16px);
      pointer-events: none;
    }

    .telemetry-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      color: #f1f5f9;
      pointer-events: auto;
    }

    .telemetry-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      animation: pulse 2.5s infinite ease-in-out;
    }

    .telemetry-divider {
      color: rgba(255, 255, 255, 0.22);
      font-weight: 400;
    }

    .telemetry-fps {
      color: var(--emerald);
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .telemetry-res {
      color: var(--accent);
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .telemetry-aa {
      color: #a78bfa;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .icon-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.15s ease;
      touch-action: manipulation;
      pointer-events: auto;
    }
    .icon-btn:hover {
      border-color: var(--accent);
      color: #fff;
    }
    .icon-btn:active {
      transform: scale(0.96);
    }

    /* Floating Bottom Dock */
    #bottom-dock {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      width: calc(100% - 20px);
      max-width: 580px;
      pointer-events: none;
    }

    .dock-island {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 18px;
      padding: 8px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }

    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .dock-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 3px 8px;
    }

    .dock-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding-left: 2px;
      padding-right: 2px;
      flex-shrink: 0;
    }

    .hud-dropdown {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      padding: 5px 22px 5px 4px;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 6px center;
      background-size: 12px;
    }
    .hud-dropdown option {
      background-color: #0c121e;
      color: #f1f5f9;
      font-size: 12px;
      padding: 6px;
    }

    /* Palette chips row */
    .palette-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      width: 100%;
      align-items: center;
    }

    .palette-chip {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 5px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .palette-chip:hover {
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .palette-chip.active {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(0, 240, 255, 0.25);
    }

    .color-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .swatch-gold {
      background: linear-gradient(135deg, #f59e0b, #ffe270);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
    }
    .swatch-cyan {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
    }
    .swatch-porcelain {
      background: linear-gradient(135deg, #f8fafc, #cbd5e1);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
    }
    .swatch-magma {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
    }

    .tuning-toggle-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 10px;
      padding: 5px 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      transition: all 0.15s ease;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .tuning-toggle-btn:hover, .tuning-toggle-btn.active {
      background: rgba(0, 240, 255, 0.22);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    /* Tuning Panel & Sliders */
    .tuning-panel {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      overflow-x: hidden;
      max-height: 380px;
      opacity: 1;
      transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, padding 0.2s ease;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }
    .tuning-panel::-webkit-scrollbar {
      width: 4px;
    }
    .tuning-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }
    .tuning-panel.closed {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      border-top: none;
      pointer-events: none;
    }
    .tuning-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .slider-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .slider-card.full-width {
      grid-column: span 2;
    }
    .slider-card-highlight {
      background: rgba(0, 240, 255, 0.04);
      border-color: rgba(0, 240, 255, 0.22);
    }
    .slider-card-highlight:focus-within {
      border-color: var(--accent);
    }
    .mode-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      line-height: 1.4;
      touch-action: manipulation;
    }
    .mode-badge.auto {
      background: rgba(16, 185, 129, 0.16);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.35);
    }
    .mode-badge.auto:hover {
      background: rgba(16, 185, 129, 0.28);
    }
    .mode-badge.manual {
      background: rgba(245, 158, 11, 0.18);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.45);
    }
    .mode-badge.manual:hover {
      background: rgba(245, 158, 11, 0.3);
    }
    .slider-sublabels {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.38);
      font-weight: 600;
      margin-top: 1px;
      padding: 0 1px;
      pointer-events: none;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .slider-num {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }
    input[type="range"]:focus {
      outline: none;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      margin-top: -5px;
      transition: transform 0.1s ease;
    }
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.25);
    }
    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px;
    }
    input[type="range"]::-moz-range-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      border: none;
    }
    .tuning-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
    }
    .tuning-sub-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      transition: color 0.15s ease;
      touch-action: manipulation;
    }
    .tuning-sub-btn:hover {
      color: var(--text);
      text-decoration: underline;
    }

    /* Gesture Hint Toast */
    #gesture-hint {
      align-self: center;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    @media (max-width: 480px) {
      #top-bar {
        gap: 5px;
      }
      .telemetry-pill {
        padding: 5px 8px;
        gap: 6px;
        font-size: 10px;
      }
      #fidelity-label {
        display: none;
      }
      .palette-row {
        grid-template-columns: repeat(4, 1fr);
      }
      .tuning-grid {
        grid-template-columns: 1fr;
      }
      .slider-card.full-width {
        grid-column: span 1;
      }
      .dock-island {
        padding: 6px 8px;
        border-radius: 16px;
      }
      .palette-chip {
        padding: 5px 3px;
        font-size: 10px;
      }
      .palette-chip span:last-child {
        display: none;
      }
      .palette-chip .color-swatch {
        margin: 0 2px;
      }
      .tuning-toggle-btn {
        padding: 5px 8px;
        font-size: 10px;
      }
      .hud-dropdown {
        font-size: 10px;
        padding: 4px 18px 4px 2px;
      }
    }
  </style>
</head>
<body>

  <!-- WebGL 2.0 Fullscreen Canvas -->
  <canvas id="viewport"></canvas>

  <!-- Minimalist Auto-Hiding Top Bar: Active Dynamic Resolution, TAA & Live FPS -->
  <header id="top-bar">
    <div class="telemetry-pill">
      <span class="telemetry-dot"></span>
      <span id="fps-val" class="telemetry-fps">60 FPS • 16.6ms</span>
      <span class="telemetry-divider">|</span>
      <span id="res-val" class="telemetry-res">Retina</span>
      <span class="telemetry-divider">|</span>
      <span id="aa-val" class="telemetry-aa">TAA 1x</span>
    </div>
    <div style="display: flex; gap: 6px; pointer-events: auto;">
      <button id="btn-fidelity" class="icon-btn" title="Toggle Quality / Fidelity Preset">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span id="fidelity-label">Auto HD</span>
      </button>
      <button id="btn-reset" class="icon-btn" title="Reset Camera">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset
      </button>
    </div>
  </header>

  <!-- Floating Mobile-Optimized HUD Island -->
  <footer id="bottom-dock">
    <div class="dock-island">
      <!-- Top Row: Equation Selector Dropdown & Tuning Toggle -->
      <div class="dock-row">
        <div class="dock-select-wrap">
          <label for="eq-select" class="dock-label">FRACTAL</label>
          <select id="eq-select" class="hud-dropdown">
            <option value="0">1. Power-N Mandelbulb</option>
            <option value="1">2. Architectural Mandelbox</option>
            <option value="2">3. 4D Quaternion Julia</option>
            <option value="3">4. Apollonian Gasket (Spheres)</option>
            <option value="4">5. Menger / Sierpinski Lattice</option>
            <option value="5">6. Sierpinski Tetrahedron (Pyramid)</option>
            <option value="6">7. 3D Burning Ship (Gothic Spire)</option>
            <option value="7">8. Pseudo-Kleinian (Hyperbolic Shell)</option>
            <option value="8">9. Kaliset Cosmic Coral (Cyber-Reef)</option>
          </select>
        </div>
        <button id="btn-toggle-tuning" class="tuning-toggle-btn active" title="Toggle 5 Math & Visual Sliders">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span>Sliders</span>
        </button>
      </div>

      <!-- Middle Row: Color Palettes -->
      <div class="palette-row">
        <button class="palette-chip active" data-palette="0" title="Liquid Obsidian & Gold">
          <span class="color-swatch swatch-gold"></span>
          <span>Obsidian</span>
        </button>
        <button class="palette-chip" data-palette="1" title="Deep Neon Cyan">
          <span class="color-swatch swatch-cyan"></span>
          <span>Cyan</span>
        </button>
        <button class="palette-chip" data-palette="2" title="Pearlescent Porcelain">
          <span class="color-swatch swatch-porcelain"></span>
          <span>Porcelain</span>
        </button>
        <button class="palette-chip" data-palette="3" title="Crimson Magma">
          <span class="color-swatch swatch-magma"></span>
          <span>Magma</span>
        </button>
      </div>

      <!-- Live HUD Sliders & Parameter Tuning Panel -->
      <div id="tuning-panel" class="tuning-panel">
        <div class="tuning-grid">
          <!-- Master Slider: Definition / Resolution -->
          <div class="slider-card full-width slider-card-highlight">
            <div class="slider-header">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="slider-name">DEFINITION / RESOLUTION</span>
                <button id="btn-governor-mode" class="mode-badge auto" type="button" title="Toggle Auto 60FPS Governor vs Manual Locked Resolution">AUTO 60</button>
              </div>
              <span id="val-resolution" class="slider-num">1.00x Native</span>
            </div>
            <input type="range" id="slider-resolution" min="0.5" max="2.0" step="0.05" value="1.0">
            <div class="slider-sublabels">
              <span>0.5x Retro</span>
              <span>1.0x Native</span>
              <span>1.5x HiDPI</span>
              <span>2.0x Ultra</span>
            </div>
          </div>

          <!-- Slider 1: Morph / 4D W-Slice -->
          <div class="slider-card full-width">
            <div class="slider-header">
              <span class="slider-name">1. MORPH / 4D W-SLICE</span>
              <span id="val-morph" class="slider-num">0.00</span>
            </div>
            <input type="range" id="slider-morph" min="-2.0" max="2.0" step="0.02" value="0.0">
          </div>

          <!-- Slider 2: Scale / Power -->
          <div class="slider-card full-width">
            <div class="slider-header">
              <span class="slider-name">2. SCALE / POWER</span>
              <span id="val-scale" class="slider-num">Power 8.0</span>
            </div>
            <input type="range" id="slider-scale" min="3.0" max="12.0" step="0.1" value="8.0">
          </div>

          <!-- Slider 3: Iteration Depth -->
          <div class="slider-card">
            <div class="slider-header">
              <span class="slider-name">3. ITERATION DEPTH</span>
              <span id="val-iter" class="slider-num">6 iter</span>
            </div>
            <input type="range" id="slider-iter" min="3" max="14" step="1" value="6">
          </div>

          <!-- Slider 4: Surface Polish / Metallic -->
          <div class="slider-card">
            <div class="slider-header">
              <span class="slider-name">4. SURFACE POLISH</span>
              <span id="val-polish" class="slider-num">1.5x</span>
            </div>
            <input type="range" id="slider-polish" min="0.1" max="3.0" step="0.1" value="1.5">
          </div>

          <!-- Slider 5: Crevice Shadow / AO -->
          <div class="slider-card full-width">
            <div class="slider-header">
              <span class="slider-name">5. CREVICE SHADOW / AO</span>
              <span id="val-shadow" class="slider-num">1.8x</span>
            </div>

        <div class="tuning-actions">

  <!-- WebGL 2.0 Vertex Shader -->
  <script id="vs" type="x-shader/x-vertex">#version 300 es
    precision highp float;
    in vec2 a_pos;
    out vec2 v_uv;
    void main() {
      v_uv = 0.5 * (a_pos + 1.0);
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  </script>

  <!-- WebGL 2.0 Fragment Shader: High-Fidelity Anti-Aliased Raymarching -->
  <script id="fs" type="x-shader/x-fragment">#version 300 es
    precision highp float;
    precision highp int;

    in vec2 v_uv;
    out vec4 fragColor;

    uniform vec2      u_res;
    uniform vec3      u_camPos;
    uniform vec3      u_camTarget;
    uniform float     u_fov;
    uniform float     u_time;
    uniform int       u_equation;       // 0: Mandelbulb, 1: Mandelbox, 2: Julia 4D, 3: Apollonian, 4: Menger
    uniform int       u_palette;        // 0: Obsidian & Gold, 1: Deep Cyan, 2: Porcelain, 3: Crimson Magma
    uniform int       u_maxSteps;       // Dynamic raymarching step budget
    uniform int       u_maxIter;        // Dynamic fractal iteration budget (3 to 14)
    uniform int       u_aoTaps;         // Dynamic AO tap count (1 to 3)
    uniform float     u_stepMultiplier; // Dynamic step fudge factor (0.75 to 0.90)
    uniform float     u_epsilonScale;   // Dynamic hit threshold multiplier
    uniform float     u_hitEpsilon;     // Dynamic definition hit threshold (0.003 down to 0.0006)
    uniform float     u_morph;          // Slider 1: Morph / 4D W-Slice (-2.0 to 2.0)
    uniform float     u_scalePower;     // Slider 2: Scale / Power
    uniform float     u_metallicPolish; // Slider 4: Surface Polish / Metallic (0.1 to 3.0)
    uniform float     u_aoContrast;     // Slider 5: Crevice Shadow / AO (0.5 to 3.5)
    uniform sampler2D u_prevTex;        // Previous frame texture for Progressive TAA Accumulation
    uniform int       u_sampleIndex;    // Accumulation sample index (0 = fresh frame)
    uniform vec2      u_jitter;         // Subpixel jitter offset in pixel coordinates
    uniform int       u_softShadows;    // 1: soft penumbra shadows enabled, 0: disabled

    // Analytical Bounding Sphere Check with deep-zoom inside-sphere traversal
    bool intersectSphere(vec3 ro, vec3 rd, float rad, out float tEnter, out float tExit) {
      float b = dot(ro, rd);
      float c = dot(ro, ro) - rad * rad;
      if (c <= 0.0) {
        // Camera is inside the bounding sphere during deep zoom
        tEnter = 0.001;
        tExit = -b + sqrt(max(b * b - c, 0.0));
        return true;
      }
      float h = b * b - c;
      if (h < 0.0) return false;
      h = sqrt(h);
      tEnter = -b - h;
      tExit = -b + h;
      if (tExit < 0.0) return false;
      tEnter = max(tEnter, 0.001);
      return true;
    }

    float getBoundingRadius(int eq) {
      if (eq == 0) return 2.5; // Mandelbulb
      if (eq == 1) return 3.6; // Mandelbox
      if (eq == 2) return 2.4; // Quaternion Julia
      if (eq == 3) return 2.9; // Apollonian Gasket
      if (eq == 4) return 2.4; // Menger Lattice
      if (eq == 5) return 2.6; // Sierpinski Tetrahedron
      if (eq == 6) return 2.8; // 3D Burning Ship
      if (eq == 7) return 3.4; // Pseudo-Kleinian
      return 2.8;              // Kaliset Cosmic Coral
    }

    // 1. Power-N Mandelbulb: Iconic bulbous lobes and sharp micro-filaments
    float deMandelbulb(vec3 p, float power, float morph, out float trap) {
      vec3 w = p;
      w.z += morph * 0.12;
      float dz = 1.0;
      float r = 0.0;
      trap = 1e10;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        r = length(w);
        trap = min(trap, abs(w.z) * 0.85 + length(w.xy) * 0.35);
        if (r > 3.0) break;

        float theta = acos(clamp(w.z / max(r, 1e-6), -1.0, 1.0));
        float phi = atan(w.y, w.x);

        dz = pow(r, power - 1.0) * power * dz + 1.0;
        float rPow = pow(r, power);
        theta *= power;
        phi *= power;

        w = rPow * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta)) + p;
      }
      return 0.5 * log(max(r, 1.0001)) * r / max(dz, 1e-6);
    }

    // 2. Architectural Mandelbox: Recursive pillars and geometric halls
    float deMandelbox(vec3 p, float boxScale, float morph, out float trap) {
      vec3 offset = p;
      vec3 z = p;
      float dz = 1.0;
      trap = 1e10;
      float scale = boxScale;
      float foldLimit = clamp(1.0 + morph * 0.2, 0.6, 1.4);
      const float minR2 = 0.25;
      const float fixR2 = 1.0;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        // Tglad box fold
        z = clamp(z, -foldLimit, foldLimit) * 2.0 - z;

        // Sphere fold
        float r2 = dot(z, z);
        if (r2 < minR2) {
          float temp = fixR2 / minR2;
          z *= temp;
          dz *= temp;
        } else if (r2 < fixR2) {
          float temp = fixR2 / r2;
          z *= temp;
          dz *= temp;
        }

        z = scale * z + offset;
        dz = dz * abs(scale) + 1.0;

        trap = min(trap, length(z.xz));
      }
      return (length(z) - 0.05) / max(abs(dz), 1e-5);
    }

    // 3. 4D Quaternion Julia: Smooth, alien hyper-dimensional spirals
    float deQuaternionJulia(vec3 p, float scalePower, float morph, out float trap) {
      vec4 z = vec4(p, morph * 0.45);
      vec4 c = vec4(-0.38, 0.52, 0.25, -0.18 + morph * 0.12) * (scalePower * 0.8);
      float dz2 = 1.0;
      float r2 = 0.0;
      trap = 1e10;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        r2 = dot(z, z);
        if (r2 > 4.5) break;

        dz2 *= 4.0 * r2;
        z = vec4(
          z.x * z.x - dot(z.yzw, z.yzw),
          2.0 * z.x * z.yzw
        ) + c;

        trap = min(trap, abs(z.x * z.y) * 1.2 + length(z.zw) * 0.6);
      }
      return 0.35 * sqrt(r2 / max(dz2, 1e-6)) * log(max(r2, 1.0001));
    }

    // 4. Apollonian Gasket: Pure hollow spheres and nested orbits
    float deApollonian(vec3 p, float scalePower, float morph, out float trap) {
      vec3 z = p;
      float scale = 1.0;
      trap = 1e10;
      float kParam = scalePower;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        z = -1.0 + 2.0 * fract(0.5 * z + 0.5);
        float r2 = dot(z, z);
        trap = min(trap, r2);
        float k = max(kParam / max(r2, 0.001), 0.15);
        z *= k;
        scale *= k;
      }
      float dSphere = 0.25 * (length(z) - (0.85 + morph * 0.18)) / scale;
      return max(dSphere, length(p) - 2.8);
    }

    // 5. Menger / Sierpinski Lattice: Clean crystalline cubic windows with open negative space
    float deMenger(vec3 p, float scalePower, float morph, out float trap) {
      vec3 z = p;
      vec3 b = abs(z) - vec3(1.0);
      float d = min(max(b.x, max(b.y, b.z)), 0.0) + length(max(b, 0.0));
      float s = 1.0;
      trap = 1e10;
      float sc = scalePower;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        vec3 a = mod(z * s, 2.0) - 1.0;
        s *= sc;
        vec3 r = abs(1.0 - sc * abs(a));
        float da = max(r.x, r.y);
        float db = max(r.y, r.z);
        float dc = max(r.z, r.x);
        float c = (min(da, min(db, dc)) - (1.0 + morph * 0.15)) / s;
        d = max(d, c);
        trap = min(trap, length(r.xy) * 0.5 + abs(r.z) * 0.5);
      }
      return d;
    }

    // 6. Sierpinski Tetrahedron: Triangular pyramid IFS with sacred geometry facets
    float deTetrahedron(vec3 p, float scaleFactor, float morph, out float trap) {
      vec3 z = p;
      float scale = 1.0;
      trap = 1e10;
      vec3 offset = vec3(1.0, 1.0, 1.0);
      float sc = scaleFactor;

      float ang = morph * 0.35;
      float cosA = cos(ang);
      float sinA = sin(ang);
      mat2 rot = mat2(cosA, -sinA, sinA, cosA);

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;

        if (z.x + z.y < 0.0) z.xy = -z.yx;
        if (z.x + z.z < 0.0) z.xz = -z.zx;
        if (z.y + z.z < 0.0) z.yz = -z.zy;

        z.xz = rot * z.xz;

        z = z * sc - offset * (sc - 1.0);
        scale *= sc;

        trap = min(trap, length(z.xy) * 0.45 + abs(z.z) * 0.55);
      }
      return (length(z) - 1.35) / max(scale, 1e-4);
    }

    // 7. 3D Burning Ship: Flaming gothic towers, ribbed hulls, and needle spires
    float deBurningShip(vec3 p, float power, float morph, out float trap) {
      vec3 w = p;
      w.y += morph * 0.15;
      float dz = 1.0;
      float r = 0.0;
      trap = 1e10;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        w = abs(w);

        r = length(w);
        trap = min(trap, abs(w.y - w.x) * 0.7 + abs(w.z) * 0.5);
        if (r > 3.2) break;

        float theta = acos(clamp(w.z / max(r, 1e-6), -1.0, 1.0));
        float phi = atan(w.y, w.x);

        dz = pow(r, power - 1.0) * power * dz + 1.0;
        float rPow = pow(r, power);
        theta *= power;
        phi *= power;

        w = rPow * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta)) + p;
      }
      return 0.5 * log(max(r, 1.0001)) * r / max(dz, 1e-6);
    }

    // 8. Pseudo-Kleinian: Hyperbolic limit set with interlocking spirals and baroque shells
    float dePseudoKleinian(vec3 p, float scaleFactor, float morph, out float trap) {
      vec3 z = p;
      float scale = 1.0;
      trap = 1e10;
      vec3 c = vec3(0.08 + morph * 0.08, 0.42, 0.12);
      float boxLimit = 1.1;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        z.x = clamp(z.x, -boxLimit, boxLimit) * 2.0 - z.x;
        z.y = clamp(z.y, -boxLimit, boxLimit) * 2.0 - z.y;

        float r2 = dot(z, z);
        float k = max(scaleFactor / max(r2, 0.22), 0.45);
        z *= k;
        scale *= k;

        z += c;
        trap = min(trap, r2);
      }
      float d = (length(z.xy) - 0.25) / max(scale, 1e-5);
      return max(d, length(p) - 3.2);
    }

    // 9. Kaliset Cosmic Coral: Organic cyber-reef with recursive dendritic crystals
    float deKaliset(vec3 p, float scaleFactor, float morph, out float trap) {
      vec3 z = p;
      float dz = 1.0;
      trap = 1e10;
      vec3 c = vec3(0.55 + morph * 0.1, 0.65, 0.82);
      float sc = scaleFactor;

      for (int i = 0; i < 14; i++) {
        if (i >= u_maxIter) break;
        z = abs(z);
        float r2 = dot(z, z);
        if (r2 < 0.001) break;
        float inv = sc / max(r2, 0.04);
        z = z * inv - c;
        dz = dz * inv;
        trap = min(trap, length(z.xz));
      }
      float d = 0.5 * (length(z) - 0.35) / max(dz, 1e-4);
      return max(d, length(p) - 2.8);
    }

    // Master distance evaluator
    float mapScene(vec3 p, out float trap) {
      if (u_equation == 0) {
        return deMandelbulb(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 1) {
        return deMandelbox(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 2) {
        return deQuaternionJulia(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 3) {
        return deApollonian(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 4) {
        return deMenger(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 5) {
        return deTetrahedron(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 6) {
        return deBurningShip(p, u_scalePower, u_morph, trap);
      } else if (u_equation == 7) {
        return dePseudoKleinian(p, u_scalePower, u_morph, trap);
      } else {
        return deKaliset(p, u_scalePower, u_morph, trap);
      }
    }

    // Smooth tetrahedral normal calculation for crisp edge highlights without stepping artifacts:
    // Symmetrically spaced tetrahedral vertices with epsilon scaled to dynamic definition precision
    vec3 calcNormal(vec3 p, float t) {
      float eps = max(t * u_hitEpsilon * 0.75, 0.00002);
      vec2 e = vec2(1.0, -1.0) * 0.57735027 * eps;
      float tr;
      return normalize(
        e.xyy * mapScene(p + e.xyy, tr) +
        e.yyx * mapScene(p + e.yyx, tr) +
        e.yxy * mapScene(p + e.yxy, tr) +
        e.xxx * mapScene(p + e.xxx, tr)
      );
    }

    // Dynamic contact ambient occlusion with enhanced crevice contrast: 0 to 4 taps
    float calcAO(vec3 p, vec3 n) {
      if (u_aoTaps <= 0) return 1.0;
      float occ = 0.0;
      float sca = 1.0;
      float tr;
      for (int i = 1; i <= 4; i++) {
        if (i > u_aoTaps) break;
        float h = float(i) * 0.038;
        float d = mapScene(p + h * n, tr);
        occ += max(0.0, h - d) * sca;
        sca *= 0.70;
      }
      return clamp(1.0 - 3.4 * occ, 0.04, 1.0);
    }

    // Soft penumbra shadow raymarching towards directional key light
    float calcSoftShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
      float res = 1.0;
      float t = mint;
      float tr;
      for (int i = 0; i < 16; i++) {
        if (t >= maxt) break;
        float d = mapScene(ro + rd * t, tr);
        if (d < 0.0002) return 0.0;
        res = min(res, k * d / t);
        t += max(d * 0.85, 0.015);
      }
      return clamp(res, 0.0, 1.0);
    }

    // Multi-source ambient environment & studio reflection
    vec3 getEnvironment(vec3 rd, vec3 keyDir) {
      float grad = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 sky = mix(vec3(0.010, 0.014, 0.022), vec3(0.038, 0.048, 0.068), grad);
      float horizon = pow(1.0 - abs(rd.y), 8.0);
      float sunDot = max(dot(rd, keyDir), 0.0);
      vec3 sunGlow = pow(sunDot, 12.0) * vec3(0.5, 0.4, 0.25);
      return sky + horizon * vec3(0.06, 0.09, 0.14) + sunGlow;
    }

    // High-contrast clean palettes
    vec3 getPaletteSurface(int pal, float trap, out vec3 specColor, out vec3 rimColor) {
      vec3 col = vec3(0.0);
      specColor = vec3(1.0);
      rimColor = vec3(1.0);

      float t = clamp(fract(trap * 0.8), 0.0, 1.0);

      if (pal == 0) {
        // 1. Liquid Obsidian & Gold: Deep reflective onyx with pure 24K gold filaments
        vec3 obsidian = mix(vec3(0.015, 0.020, 0.028), vec3(0.065, 0.070, 0.085), t);
        vec3 gold = vec3(1.0, 0.80, 0.25);
        float goldEdge = pow(1.0 - t, 2.4);
        col = mix(obsidian, gold * 0.95, goldEdge * 0.7);
        specColor = mix(vec3(1.0, 0.92, 0.65), gold, 0.75);
        rimColor = gold;
      } else if (pal == 1) {
        // 2. Deep Neon Cyan: Electric cyber-grid on midnight carbon
        vec3 navy = mix(vec3(0.010, 0.020, 0.038), vec3(0.030, 0.060, 0.110), t);
        vec3 cyan = vec3(0.0, 0.95, 1.0);
        col = mix(cyan * 0.85, navy, smoothstep(0.03, 0.70, t));
        specColor = mix(vec3(0.85, 0.98, 1.0), cyan, 0.6);
        rimColor = cyan;
      } else if (pal == 2) {
        // 3. Pearlescent Porcelain: Sculptural museum marble with pearlescent sheen
        vec3 porcelain = mix(vec3(0.80, 0.83, 0.88), vec3(0.96, 0.97, 0.99), t);
        vec3 shimmer = mix(vec3(0.92, 0.84, 1.0), vec3(0.82, 0.95, 1.0), sin((trap + 0.1) * 6.28) * 0.5 + 0.5);
        col = mix(porcelain, shimmer, 0.18);
        specColor = vec3(1.0, 1.0, 1.0);
        rimColor = vec3(0.88, 0.94, 1.0);
      } else {
        // 4. Crimson Magma: Volcanic cooled basalt with molten glowing magma
        vec3 basalt = mix(vec3(0.025, 0.018, 0.020), vec3(0.095, 0.065, 0.065), t);
        vec3 magma = mix(vec3(1.0, 0.10, 0.01), vec3(1.0, 0.65, 0.05), pow(1.0 - t, 2.0));
        col = mix(magma, basalt, smoothstep(0.02, 0.60, t));
        specColor = vec3(1.0, 0.80, 0.45);
        rimColor = vec3(1.0, 0.28, 0.06);
      }
      return col;
    }

    // Clean, minimalist background gradient
    vec3 getBackground(vec3 rd) {
      float grad = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
      return mix(vec3(0.008, 0.010, 0.015), vec3(0.022, 0.026, 0.038), grad);
    }

    void main() {
      // Normalized screen coordinates with subpixel jitter for Progressive Anti-Aliasing (TAA)
      vec2 p = (gl_FragCoord.xy + u_jitter - 0.5 * u_res) / u_res.y;

      // Look-At Camera Ray Setup
      vec3 ro = u_camPos;
      vec3 ta = u_camTarget;
      vec3 ww = normalize(ta - ro);
      vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
      vec3 vv = cross(uu, ww);

      float fovFactor = tan(radians(u_fov * 0.5));
      vec3 rd = normalize(p.x * uu * fovFactor + p.y * vv * fovFactor + ww);

      // Analytical Bounding Sphere Envelope Check
      float boundingRadius = getBoundingRadius(u_equation);
      float tEnter = 0.001;
      float tExit = 24.0;
      bool hitBound = intersectSphere(ro, rd, boundingRadius, tEnter, tExit);

      vec3 col;

      if (!hitBound) {
        col = getBackground(rd);
      } else {
        // Raymarching: dynamic step budget regulated by performance governor
        float t = tEnter;
        float tMax = min(tExit, 24.0);
        float stepFudge = u_stepMultiplier;
        bool hit = false;
        float hitTrap = 0.0;
        float trap = 0.0;
        float boundR2 = boundingRadius * boundingRadius;

        for (int i = 0; i < 144; i++) {
          if (i >= u_maxSteps || t > tMax) break;
          vec3 pos = ro + rd * t;

          // Early ray escape threshold
          if (dot(pos, pos) > boundR2) break;

          float d = mapScene(pos, trap);

          // Dynamic surface hit threshold (EPSILON): scales from 0.003 down to 0.0006 with deep-zoom retention
          float eps = max(t * u_hitEpsilon, 0.000004);

          if (d < eps) {
            hit = true;
            hitTrap = trap;
            break;
          }
          t += d * stepFudge;
        }

        col = getBackground(rd);

        if (hit) {
          vec3 pos = ro + rd * t;
          vec3 nor = calcNormal(pos, t);

          // Directional key light with Blinn-Phong specular glints on metallic edges
          vec3 keyDir = normalize(vec3(1.25, 1.75, 1.05));
          float keyDiff = max(dot(nor, keyDir), 0.0);
          float skyDiff = clamp(nor.y * 0.5 + 0.5, 0.0, 1.0) * 0.18;

          // Contact Ambient Occlusion with enhanced crevice contrast
          float rawAO = calcAO(pos, nor);
          float ao = clamp(pow(rawAO, u_aoContrast * 1.35), 0.03, 1.0);

          // Soft Directional Penumbra Shadow
          float shadow = 1.0;
          if (u_softShadows > 0) {
            shadow = calcSoftShadow(pos + nor * 0.006, keyDir, 0.015, 2.8, 14.0);
            shadow = mix(0.18, 1.0, shadow);
          }

          // Blinn-Phong specular glints on metallic edges modulated by Surface Polish slider
          vec3 halfVec = normalize(keyDir - rd);
          float shininess = 24.0 * u_metallicPolish + 8.0;
          float spec = pow(max(dot(nor, halfVec), 0.0), shininess);
          float fresnel = pow(clamp(1.0 + dot(rd, nor), 0.0, 1.0), 3.5 / max(u_metallicPolish, 0.2));

          // Geometric specular anti-aliasing (prevents micro-sparkle aliasing)
          float specAtten = clamp(1.0 - t * 0.06, 0.2, 1.0);

          // Surface palette color
          vec3 specColor;
          vec3 rimColor;
          vec3 surface = getPaletteSurface(u_palette, hitTrap, specColor, rimColor);

          // Direct lighting composition with soft shadow and deep crevice sky attenuation
          vec3 keyLight = keyDiff * shadow * vec3(1.55, 1.46, 1.36);
          vec3 skyLight = skyDiff * vec3(0.35, 0.42, 0.52) * pow(rawAO, 1.5);
          vec3 lighting = (keyLight + skyLight) * ao;
          col = surface * lighting;

          // Realistic Image-Based Environment Reflection (IBL)
          vec3 refDir = reflect(rd, nor);
          vec3 envColor = getEnvironment(refDir, keyDir);
          col += envColor * rimColor * (fresnel * 0.55 * u_metallicPolish) * ao;

          // Metallic edges specular glints and silhouette rim scaled by Surface Polish slider
          col += rimColor * fresnel * (0.50 * u_metallicPolish) * ao;
          col += specColor * spec * (2.4 * u_metallicPolish * specAtten) * ao * shadow;

          // Subsurface scattering / edge translucency on thin micro-lobes
          float backLight = pow(clamp(dot(-rd, keyDir), 0.0, 1.0), 3.0);
          float sss = backLight * (1.0 - rawAO) * 0.32 * u_metallicPolish;
          col += rimColor * sss;

          // Subtle distance fog & depth fading to accentuate scale and 3D depth
          float objDepth = max(0.0, t - tEnter);
          float fogFactor = 1.0 - exp(-objDepth * 0.075);
          float sunScattering = pow(max(dot(rd, keyDir), 0.0), 8.0);
          vec3 skyCol = getBackground(rd);
          vec3 hazeCol = mix(skyCol, vec3(0.025, 0.035, 0.055) + sunScattering * vec3(0.28, 0.22, 0.15), 0.4);

      });

      // DOM Elements for Definition Slider, Math Sliders & Tuning Drawer
      const sliderRes       = document.getElementById('slider-resolution');
      const valResSliderEl  = document.getElementById('val-resolution');
      const btnGovMode      = document.getElementById('btn-governor-mode');
      const sliderMorph     = document.getElementById('slider-morph');
      const sliderScale     = document.getElementById('slider-scale');
      const sliderIter      = document.getElementById('slider-iter');
      const sliderPolish    = document.getElementById('slider-polish');
      const sliderShadow    = document.getElementById('slider-shadow');

      const valMorphEl      = document.getElementById('val-morph');
      const valScaleEl      = document.getElementById('val-scale');
      const valIterEl       = document.getElementById('val-iter');
      const valPolishEl     = document.getElementById('val-polish');
      const valShadowEl     = document.getElementById('val-shadow');

      const eqSelect        = document.getElementById('eq-select');
      const tuningPanelEl   = document.getElementById('tuning-panel');
      const btnToggleTuning = document.getElementById('btn-toggle-tuning');
      const btnResetSliders = document.getElementById('btn-reset-sliders');
      const btnRandomSliders = document.getElementById('btn-random-sliders');

      // Fidelity Mode Switcher ('auto' -> 'ultra' -> 'perf')
      const btnFidelity   = document.getElementById('btn-fidelity');
      const fidelityLabel = document.getElementById('fidelity-label');

      function updateFidelityUI() {
        if (!fidelityLabel) return;
        if (state.fidelityMode === 'ultra') {
          fidelityLabel.textContent = 'Ultra HD';
          if (btnFidelity) btnFidelity.style.borderColor = 'var(--accent)';
        } else if (state.fidelityMode === 'perf') {
          fidelityLabel.textContent = 'Fast 60';
          if (btnFidelity) btnFidelity.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        } else {
          fidelityLabel.textContent = 'Auto HD';
          if (btnFidelity) btnFidelity.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        }
      }

      function updateResolutionSliderUI() {
        if (!sliderRes) return;
        const scale = state.resolutionScale;
        sliderRes.value = scale;
        if (valResSliderEl) {
          let label = `${scale.toFixed(2)}x`;
          if (scale <= 0.65) label += ' Retro';
          else if (scale >= 1.75) label += ' Ultra';
          else if (scale >= 1.25) label += ' HiDPI';
          else label += ' Native';
          valResSliderEl.textContent = label;
        }
        if (btnGovMode) {
          if (state.manualResolution) {
            btnGovMode.textContent = 'MANUAL [LOCK]';
            btnGovMode.className = 'mode-badge manual';
            btnGovMode.title = 'Manual Resolution Locked (Dynamic Governor Overridden). Click to re-enable Auto Governor.';
          } else {
            btnGovMode.textContent = 'AUTO 60';
            btnGovMode.className = 'mode-badge auto';
            btnGovMode.title = 'Dynamic 60FPS Governor Active. Drag slider to set manual definition.';
          }
        }
      }

      // Definition / Resolution Slider (0.5x retro pixelated to 2.0x HiDPI supersampling)
      if (sliderRes) {
        sliderRes.addEventListener('input', (e) => {
          state.resolutionScale = parseFloat(e.target.value);
          state.manualResolution = true; // User adjusted manual definition: override dynamic 0.65x governor!
          updateResolutionSliderUI();
          sampleCount = 0;
          governor.applyCanvasResolution(gl, canvas, false);
          resetIdleTimer();
        });
      }

      // Governor Mode Override Toggle Badge
      if (btnGovMode) {
        btnGovMode.addEventListener('click', () => {
          state.manualResolution = !state.manualResolution;
          if (!state.manualResolution) {
            state.resolutionScale = 1.0;
          }
          updateResolutionSliderUI();
          sampleCount = 0;
          governor.applyCanvasResolution(gl, canvas, false);
          resetIdleTimer();
        });
      }

      if (btnFidelity) {
        btnFidelity.addEventListener('click', () => {
          if (state.fidelityMode === 'auto') {
            state.fidelityMode = 'ultra';
            state.manualResolution = false;
            state.resolutionScale = 2.0;
          } else if (state.fidelityMode === 'ultra') {
            state.fidelityMode = 'perf';
            state.manualResolution = false;
            state.resolutionScale = 0.65;
          } else {
            state.fidelityMode = 'auto';
            state.manualResolution = false;
            state.resolutionScale = 1.0;
          }
          updateFidelityUI();
          updateResolutionSliderUI();
          sampleCount = 0;
          governor.applyCanvasResolution(gl, canvas, false);
          resetIdleTimer();
        });
      }

      function updateScaleSliderUI() {
        const spCfg = eqConfigs[state.equation].scalePower;
        if (!sliderScale) return;
        sliderScale.min = spCfg.min;
        sliderScale.max = spCfg.max;
        sliderScale.step = spCfg.step;
        sliderScale.value = state.scalePower;
        if (valScaleEl) {
          valScaleEl.textContent = `${spCfg.name} ${Number(state.scalePower).toFixed(spCfg.decimals)}`;
        }
      }

      function updateMorphSliderUI() {
        if (!sliderMorph) return;
        sliderMorph.value = state.morph;
        if (valMorphEl) {
          valMorphEl.textContent = (state.morph >= 0 ? '+' : '') + Number(state.morph).toFixed(2);
        }
      }

      function switchEquation(eq) {
        state.equation = eq;
        if (eqSelect) eqSelect.value = eq;
        state.scalePower = eqConfigs[eq].scalePower.val;
        state.morph = eqConfigs[eq].morphDefault;
        sampleCount = 0;
        updateScaleSliderUI();
        updateMorphSliderUI();
        resetCamera();
        resetIdleTimer();
      }

      // Slider 1: Morph / 4D W-Slice (-2.0 to 2.0)
      if (sliderMorph) {
        sliderMorph.addEventListener('input', (e) => {
          state.morph = parseFloat(e.target.value);
          sampleCount = 0;
          if (valMorphEl) valMorphEl.textContent = (state.morph >= 0 ? '+' : '') + state.morph.toFixed(2);
          resetIdleTimer();
        });
      }

      // Slider 2: Scale / Power (Equation-dependent)
      if (sliderScale) {
        sliderScale.addEventListener('input', (e) => {
          state.scalePower = parseFloat(e.target.value);
          eqConfigs[state.equation].scalePower.val = state.scalePower;
          sampleCount = 0;
          const spCfg = eqConfigs[state.equation].scalePower;
          if (valScaleEl) valScaleEl.textContent = `${spCfg.name} ${state.scalePower.toFixed(spCfg.decimals)}`;
          resetIdleTimer();
        });
      }

      // Slider 3: Iteration Depth (3 to 14)
      if (sliderIter) {
        sliderIter.addEventListener('input', (e) => {
          state.maxIter = parseInt(e.target.value, 10);
          sampleCount = 0;
          if (valIterEl) valIterEl.textContent = `${state.maxIter} iter`;
          resetIdleTimer();
        });
      }

      // Slider 4: Surface Polish / Metallic (0.1 to 3.0)
      if (sliderPolish) {
        sliderPolish.addEventListener('input', (e) => {
          state.metallicPolish = parseFloat(e.target.value);
          sampleCount = 0;
          if (valPolishEl) valPolishEl.textContent = `${state.metallicPolish.toFixed(1)}x`;
          resetIdleTimer();
        });
      }

      // Slider 5: Crevice Shadow / AO (0.5 to 3.5)
      if (sliderShadow) {
        sliderShadow.addEventListener('input', (e) => {
          state.aoContrast = parseFloat(e.target.value);
          sampleCount = 0;
          if (valShadowEl) valShadowEl.textContent = `${state.aoContrast.toFixed(1)}x`;
          resetIdleTimer();
        });
      }

      // Prevent slider touches from causing camera orbit/pinch
      const stopSliderProp = (e) => e.stopPropagation();
      [sliderRes, btnGovMode, sliderMorph, sliderScale, sliderIter, sliderPolish, sliderShadow, tuningPanelEl, eqSelect, btnFidelity].forEach(el => {
        if (!el) return;
        el.addEventListener('pointerdown', stopSliderProp, { passive: true });
        el.addEventListener('pointermove', stopSliderProp, { passive: true });
        el.addEventListener('touchstart', stopSliderProp, { passive: true });
        el.addEventListener('touchmove', stopSliderProp, { passive: true });
      });

      // Toggle Tuning Drawer
      if (btnToggleTuning && tuningPanelEl) {
        btnToggleTuning.addEventListener('click', () => {
          const isClosed = tuningPanelEl.classList.toggle('closed');
          btnToggleTuning.classList.toggle('active', !isClosed);
          resetIdleTimer();
        });
      }

      // Reset Sliders to Defaults
      if (btnResetSliders) {
        btnResetSliders.addEventListener('click', () => {
          const cfg = eqConfigs[state.equation];
          const defaultScalePowers = [8.0, -2.2, 1.2, 1.8, 3.0, 2.0, 8.0, 1.75, 1.35];
          state.scalePower = defaultScalePowers[state.equation] !== undefined ? defaultScalePowers[state.equation] : 2.0;
          cfg.scalePower.val = state.scalePower;
          state.maxIter = 6;
          state.metallicPolish = 1.5;
          state.aoContrast = 1.8;
          state.manualResolution = false;
          state.resolutionScale = 1.0;
          sampleCount = 0;

          if (sliderIter) sliderIter.value = 6;
          if (sliderPolish) sliderPolish.value = 1.5;
          if (sliderShadow) sliderShadow.value = 1.8;

          if (valIterEl) valIterEl.textContent = '6 iter';
          if (valPolishEl) valPolishEl.textContent = '1.5x';
          if (valShadowEl) valShadowEl.textContent = '1.8x';

          updateMorphSliderUI();
          updateScaleSliderUI();
          updateResolutionSliderUI();
          governor.applyCanvasResolution(gl, canvas, false);
          resetIdleTimer();
        });
      }

      // Randomize Form / Math Parameter
      if (btnRandomSliders) {
        btnRandomSliders.addEventListener('click', () => {
          const spCfg = eqConfigs[state.equation].scalePower;
          const randScale = spCfg.min + Math.random() * (spCfg.max - spCfg.min);
          state.scalePower = parseFloat(randScale.toFixed(spCfg.decimals));
          spCfg.val = state.scalePower;

          const randMorph = -1.5 + Math.random() * 3.0;
          state.morph = parseFloat(randMorph.toFixed(2));

          state.metallicPolish = parseFloat((0.5 + Math.random() * 2.2).toFixed(1));
          state.aoContrast = parseFloat((1.0 + Math.random() * 2.0).toFixed(1));
          sampleCount = 0;

          if (sliderPolish) sliderPolish.value = state.metallicPolish;
          if (sliderShadow) sliderShadow.value = state.aoContrast;
          if (valPolishEl) valPolishEl.textContent = `${state.metallicPolish.toFixed(1)}x`;
          if (valShadowEl) valShadowEl.textContent = `${state.aoContrast.toFixed(1)}x`;

          updateMorphSliderUI();
          updateScaleSliderUI();
          resetIdleTimer();
        });
      }

      // Dropdown Equation Switcher (5 Equations)
      if (eqSelect) {
        eqSelect.addEventListener('change', (e) => {
          const eq = parseInt(e.target.value, 10);
          switchEquation(eq);
        });
      }

      // Palette Chips
      const palBtns = document.querySelectorAll('[data-palette]');
      palBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const pal = parseInt(btn.dataset.palette, 10);
          state.palette = pal;
          sampleCount = 0;
          palBtns.forEach(b => b.classList.toggle('active', b === btn));
          resetIdleTimer();
        });
      });

      // Reset Button
      const resetBtn = document.getElementById('btn-reset');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          resetCamera();
          resetIdleTimer();
        });
      }

      // Hide gesture hint after 4.5 seconds
      setTimeout(() => {
        const hint = document.getElementById('gesture-hint');
        if (hint) hint.style.opacity = '0';
      }, 4500);

      // Initialize Sliders & Fidelity UI
      updateScaleSliderUI();
      updateMorphSliderUI();
      updateResolutionSliderUI();
      updateFidelityUI();

      // Render Loop
      const startTime = performance.now();

      function render(now) {
        requestAnimationFrame(render);

        // Inertia tracking for interaction sensing
        const dYaw = Math.abs(state.targetYaw - state.yaw);
        const dPitch = Math.abs(state.targetPitch - state.pitch);
        const dDist = Math.abs(state.targetDist - state.dist);
        const dInertia = dYaw + dPitch + dDist;
        const isInteracting = isPointerDown || dInertia > 0.0008;

        // Smooth Camera Inertia Damping
        state.yaw += (state.targetYaw - state.yaw) * 0.16;
        state.pitch += (state.targetPitch - state.pitch) * 0.16;
        state.dist += (state.targetDist - state.dist) * 0.16;

        if (isInteracting) {
          sampleCount = 0;
        }

        const maxSamples = state.fidelityMode === 'ultra' ? 32 : (state.fidelityMode === 'perf' ? 12 : 24);

        // Idle power-saving: if fully accumulated and completely still, skip heavy GPU raymarching
        if (!isInteracting && sampleCount >= maxSamples) {
          updateHUDTelemetry(now);
          return;
        }

        // Self-Regulating Performance Governor & Dynamic Resolution
        governor.update(now, isInteracting, state.equation);
        governor.applyCanvasResolution(gl, canvas, isInteracting);
        updateHUDTelemetry(now);

        resizeAccumBuffers(canvas.width, canvas.height);

        const time = (now - startTime) * 0.001;
        const camPos = getCameraPosition();
        const activeIter = Math.max(3, state.maxIter - governor.iterPenalty);

        // Soft shadows: enabled in Ultra HD, or when settled in Auto mode
        const enableSoftShadows = (state.fidelityMode === 'ultra') || (!isInteracting && sampleCount > 0);

        // Ping-Pong FBO selection
        const srcIdx = accumIndex;
        const dstIdx = 1 - accumIndex;

        // Render to destination accumulation FBO
        gl.bindFramebuffer(gl.FRAMEBUFFER, accumFBO[dstIdx]);
        gl.viewport(0, 0, canvas.width, canvas.height);

        // Bind source history texture
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, accumTex[srcIdx]);
        gl.uniform1i(uPrevTexLocation, 0);
        gl.uniform1i(uSampleIndexLocation, sampleCount);

        // Subpixel jitter for Halton TAA
        let jx = 0;
        let jy = 0;
        if (sampleCount > 0) {
          jx = halton(sampleCount, 2) - 0.5;
          jy = halton(sampleCount, 3) - 0.5;
        }
        gl.uniform2f(uJitterLocation, jx, jy);
        gl.uniform1i(uSoftShadowsLocation, enableSoftShadows ? 1 : 0);

        gl.uniform2f(uResLocation, canvas.width, canvas.height);
        gl.uniform3fv(uCamPosLocation, camPos);
        gl.uniform3fv(uCamTargetLocation, state.camTarget);
        gl.uniform1f(uFovLocation, state.fov);
        gl.uniform1f(uTimeLocation, time);
        gl.uniform1i(uEquationLocation, state.equation);
        gl.uniform1i(uPaletteLocation, state.palette);
        gl.uniform1i(uMaxStepsLocation, governor.maxSteps);
        gl.uniform1i(uMaxIterLocation, activeIter);
        gl.uniform1i(uAoTapsLocation, governor.aoTaps);
        gl.uniform1f(uStepMultLocation, governor.stepMultiplier);
        gl.uniform1f(uEpsScaleLocation, governor.epsilonScale);
        gl.uniform1f(uHitEpsilonLocation, governor.hitEpsilon);
        gl.uniform1f(uMorphLocation, state.morph);
        gl.uniform1f(uScalePowerLocation, state.scalePower);
        gl.uniform1f(uMetallicPolishLocation, state.metallicPolish);
        gl.uniform1f(uAoContrastLocation, state.aoContrast);

        gl.drawArrays(gl.TRIANGLES, 0, 6);

        // Blit accumulated frame directly to canvas
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, accumFBO[dstIdx]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.blitFramebuffer(
          0, 0, canvas.width, canvas.height,
          0, 0, canvas.width, canvas.height,
          gl.COLOR_BUFFER_BIT, gl.NEAREST
        );

        accumIndex = dstIdx;
        if (!isInteracting) {
          sampleCount++;
        }
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
